name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::888425712638:role/github-cicd
          aws-region: eu-north-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://kasparas-portfolio-2026-888425712638-eu-north-1-an --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E337I7I1O63VUQ --paths "/*"